[pytest]
pythonpath = .
testpaths = tests
markers =
    e2e: End-to-end tests
    master: Master test suite
    sanity: Sanity tests
    regression: Regression tests
    api: API tests
    web: Web UI tests
    datadriven: Data-driven tests
addopts = --screenshot=only-on-failure --junitxml=reports/results.xml --alluredir=reports/allure-results --clean-alluredir
